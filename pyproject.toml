[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazon-buybox-checker"
version = "0.1.0"
description = "See who wins the Amazon buybox in each US state, from a web page or the command line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["amazon", "buybox", "playwright", "ecommerce", "seller"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "playwright>=1.49",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
buybox-checker = "buybox_checker.cli:main"
buybox-checker-web = "buybox_checker.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/buybox_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
